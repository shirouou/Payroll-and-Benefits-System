<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxford Suites Makati — Payroll &amp; Benefits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#A61E22;
    --navy-light:#A61E22;
    --navy-mid:#A61E22;
    --brass:#FFFFFF;
    --brass-light:#fff3f4;
    --brass-dim:#efb7bc;
    --linen:#fff7f8;
    --paper:#FFFFFF;
    --ink:#2a1c1d;
    --ink-soft:#6d4d50;
    --ink-faint:#9a7276;
    --teal:#A61E22;
    --teal-bg:#fbe5e7;
    --rust:#c62835;
    --rust-bg:#fbe9eb;
    --sage:#9f1d2d;
    --sage-bg:#f9ecee;
    --hairline:#f0d8db;
    --shadow:0 1px 3px rgba(179,18,23,0.08), 0 1px 2px rgba(179,18,23,0.05);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', -apple-system, sans-serif;
    background:var(--linen);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}
  .display{font-family:'Fraunces', serif;}

  /* ---- shell ---- */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:250px; flex-shrink:0; background:var(--navy);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:24px 22px 18px; border-bottom:1px solid rgba(255,255,255,0.15);
  }
  .brand-mark{
    font-family:'Bodoni Moda', Georgia, serif; font-size:17px; font-weight:500; color:var(--brass-light);
    letter-spacing:0.11em; text-transform:uppercase;
  }
  .brand-sub{
    font-size:11px; color:#f7c9cf; margin-top:3px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav{flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:5px;
    color:#f9dfe2; font-size:13.5px; font-weight:500; cursor:pointer; border-left:2px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:0.85;}
  .nav-item:hover{background:rgba(255,255,255,0.05); color:#FFFFFF;}
  .nav-item.active{
    background:rgba(255,255,255,0.12); color:#FFFFFF; border-left:2px solid var(--brass);
  }
  .sidebar-foot{
    padding:16px 22px 20px; border-top:1px solid rgba(255,255,255,0.12);
    font-size:11.5px; color:#f9dfe2; line-height:1.5;
  }

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    padding:26px 36px 20px; border-bottom:1px solid var(--hairline);
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
    background:var(--linen);
  }
  .page-title{font-family:'Fraunces', serif; font-size:26px; font-weight:600; color:var(--navy); line-height:1.15;}
  .page-desc{font-size:13px; color:var(--ink-soft); margin-top:5px; max-width:520px;}
  .content{padding:28px 36px 60px; flex:1;}

  /* ---- buttons ---- */
  button{font-family:'Inter', sans-serif; cursor:pointer;}
  .btn{
    padding:9px 16px; border-radius:5px; font-size:13px; font-weight:600; border:1px solid transparent;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-mid);}
  .btn-brass{background:var(--brass); color:var(--navy);}
  .btn-brass:hover{background:var(--brass-light);}
  .btn-ghost{background:var(--paper); color:var(--navy); border-color:var(--hairline);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:4px;}
  .btn-danger-text{background:none; border:none; color:var(--rust); font-size:12px; font-weight:600;}
  .btn-sage-text{background:none; border:none; color:var(--sage); font-size:12px; font-weight:600;}

  /* ---- cards & KPIs ---- */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:26px;}
  .kpi-card{
    background:var(--paper); border:1px solid var(--hairline); border-radius:7px; padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .kpi-label{font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:600;}
  .kpi-value{font-family:'Fraunces', serif; font-size:26px; font-weight:600; color:var(--navy); margin-top:8px;}
  .kpi-sub{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}

  .panel{
    background:var(--paper); border:1px solid var(--hairline); border-radius:8px; box-shadow:var(--shadow);
    margin-bottom:22px; overflow:hidden;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--hairline); display:flex; justify-content:space-between;
    align-items:center; gap:12px; flex-wrap:wrap;
  }
  .panel-title{font-family:'Fraunces', serif; font-size:16.5px; font-weight:600; color:var(--navy);}
  .panel-title-sm{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .panel-body{padding:18px 20px;}

  /* ---- table (the ledger) ---- */
  table{width:100%; border-collapse:collapse;}
  .ledger th{
    text-align:left; font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-faint);
    font-weight:700; padding:0 12px 10px; border-bottom:2px solid var(--navy);
  }
  .ledger th.num, .ledger td.num{text-align:right;}
  .ledger td{padding:12px; border-bottom:1px solid var(--hairline); font-size:13.5px; vertical-align:middle;}
  .ledger tbody tr:hover{background:#FFF9FA;}
  .ledger td.num{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; color:var(--navy);}
  .ledger tfoot td{padding:12px; font-size:13px; border-top:2px solid var(--navy); font-weight:600;}
  .row-name{font-weight:600; color:var(--ink);}
  .row-sub{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}

  /* ---- stamp badges (signature element) ---- */
  .stamp{
    display:inline-block; padding:3px 10px; border:1.4px solid; border-radius:3px;
    font-size:10px; letter-spacing:0.07em; text-transform:uppercase; font-weight:700;
    transform:rotate(-2deg); font-family:'IBM Plex Mono', monospace;
  }
  .stamp.approved, .stamp.active, .stamp.paid{color:var(--sage); border-color:var(--sage); background:var(--sage-bg);}
  .stamp.pending{color:var(--brass-dim); border-color:var(--brass); background:#FFF3F4;}
  .stamp.rejected, .stamp.inactive{color:var(--rust); border-color:var(--rust); background:var(--rust-bg);}

  /* ---- forms ---- */
  label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
  input, select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--hairline); border-radius:5px; font-size:13.5px;
    font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(179,18,23,0.10);}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--hairline); margin-bottom:20px;}
  .tab{padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab.active{color:var(--navy); border-bottom-color:var(--navy);}

  /* ---- modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(22,40,61,0.45); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:24px;
  }
  .modal{
    background:var(--paper); border-radius:9px; max-width:560px; width:100%; max-height:88vh; overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-head{padding:20px 24px; border-bottom:1px solid var(--hairline); display:flex; justify-content:space-between; align-items:flex-start;}
  .modal-title{font-family:'Fraunces', serif; font-size:19px; font-weight:600; color:var(--navy);}
  .modal-body{padding:20px 24px;}
  .modal-close{background:none; border:none; font-size:20px; color:var(--ink-faint); line-height:1;}

  /* ---- payslip ---- */
  .payslip-line{display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--hairline);}
  .payslip-line .num{font-size:13px;}
  .payslip-total{display:flex; justify-content:space-between; padding:12px 0 4px; font-size:16px; font-weight:700; color:var(--navy); border-top:2px solid var(--navy); margin-top:6px;}

  /* ---- misc ---- */
  .muted{color:var(--ink-soft);}
  .empty{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;}
  .divider{height:1px; background:var(--hairline); margin:20px 0;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-label{width:150px; font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}
  .bar-track{flex:1; height:9px; background:var(--linen); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--teal); border-radius:5px;}
  .bar-val{width:34px; text-align:right; font-size:12px; font-family:'IBM Plex Mono', monospace; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:11px 20px; border-radius:6px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.2);
    z-index:200; opacity:0; transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}
  .pill{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--teal-bg); color:var(--teal); font-weight:600;}
  .footnote{font-size:11px; color:var(--ink-faint); margin-top:14px; line-height:1.6;}
  .login-screen{min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--linen);}
  .login-card{width:min(420px,100%); background:var(--paper); border:1px solid var(--hairline); border-radius:9px; padding:30px; box-shadow:var(--shadow);}
  .login-card .brand-mark{color:var(--navy); font-size:24px;}
  .login-card .brand-sub{color:var(--ink-soft); margin-bottom:26px;}
  .login-card h1{font-family:'Fraunces',serif; color:var(--navy); font-size:24px; margin-bottom:6px;}
  .login-help{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .login-error{background:var(--rust-bg); border:1px solid var(--rust); color:var(--rust); border-radius:5px; padding:10px 12px; font-size:13px; margin-bottom:14px;}
  .login-card .field{margin-bottom:14px;}
  .login-card .btn{width:100%; justify-content:center; margin-top:4px;}
  .login-card .login-switch{width:100%; margin-top:12px; padding:8px; border:0; background:transparent; color:var(--navy); font-size:13px;}
  .user-area{display:flex; align-items:center; gap:12px; font-size:12px; color:var(--ink-soft);}
  /* Ensure buttons and user name are readable on dark sidebar */
  .login-card .btn{background:var(--navy); color:#ffffff; border-color:var(--navy);}
  .login-card .btn:disabled{opacity:0.7}
  .user-area{display:flex; align-items:center; gap:12px; font-size:12px;}
  .user-area span{color:#ffffff; font-weight:700;}
  .logout-button{background:none; border:1px solid rgba(255,255,255,0.12); color:#ffffff; border-radius:4px; padding:5px 9px; font-size:12px; font-weight:600;}
  .logout-button:hover{border-color:rgba(255,255,255,0.28);}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--hairline); border-radius:5px;}

  @media (max-width:860px){
    .sidebar{width:72px;}
    .brand-sub, .nav-item span, .sidebar-foot{display:none;}
    .nav-item{justify-content:center;}
    .field-row, .field-row3{grid-template-columns:1fr;}
    .content, .topbar{padding-left:18px; padding-right:18px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================= DATA LAYER ============================= */
const DEPARTMENTS = ['Front Office','Housekeeping','Food & Beverage','Kitchen','Sales & Marketing','Administration','Engineering & Maintenance'];

const SEED_EMPLOYEES = [
  {id:'e001', name:'Maria Santos', position:'Front Desk Officer', department:'Front Office', dateHired:'2022-03-14', baseSalary:18000, status:'Active'},
  {id:'e002', name:'Jose Reyes', position:'Concierge', department:'Front Office', dateHired:'2023-01-09', baseSalary:17000, status:'Active'},

  {id:'e004', name:'Pedro Bautista', position:'Housekeeping Attendant', department:'Housekeeping', dateHired:'2023-08-02', baseSalary:15000, status:'Active'},

  {id:'e006', name:'Mark Villanueva', position:'Waiter', department:'Food & Beverage', dateHired:'2024-02-05', baseSalary:15500, status:'Active'},
  {id:'e007', name:'Carlo Mendoza', position:'Executive Chef', department:'Kitchen', dateHired:'2019-05-12', baseSalary:35000, status:'Active'},
  {id:'e008', name:'Rina Torres', position:'Sous Chef', department:'Kitchen', dateHired:'2021-09-30', baseSalary:24000, status:'Active'},
  {id:'e009', name:'Julius Ramos', position:'Chef de Partie', department:'Kitchen', dateHired:'2022-12-01', baseSalary:18500, status:'Active'},
  {id:'e010', name:'Grace Aquino', position:'Sales & Marketing Manager', department:'Sales & Marketing', dateHired:'2020-04-22', baseSalary:28000, status:'Active'},
  {id:'e011', name:'Ben Garcia', position:'Accounting Staff', department:'Administration', dateHired:'2023-03-19', baseSalary:19000, status:'Active'},
  {id:'e012', name:'Nora Dela Cruz', position:'HR Officer', department:'Administration', dateHired:'2022-07-08', baseSalary:21000, status:'Active'},
  {id:'e013', name:'Tomas Lim', position:'Maintenance Technician', department:'Engineering & Maintenance', dateHired:'2021-01-25', baseSalary:16500, status:'Active'},
  {id:'e014', name:'Ella Navarro', position:'Bartender', department:'Food & Beverage', dateHired:'2024-05-30', baseSalary:16000, status:'Active'},
];

const SEED_CLAIMS = [
  {id:'c001', employeeId:'e007', type:'Medical', amount:3200, description:'Consultation and medication', dateFiled:'2026-06-18', status:'Approved'},
  {id:'c002', employeeId:'e003', type:'Transportation', amount:850, description:'Off-site training travel', dateFiled:'2026-06-22', status:'Approved'},
  {id:'c003', employeeId:'e006', type:'Meal', amount:450, description:'Overtime meal allowance', dateFiled:'2026-07-01', status:'Pending'},
  {id:'c004', employeeId:'e010', type:'Training', amount:5000, description:'Hospitality sales certification', dateFiled:'2026-07-03', status:'Pending'},
  {id:'c005', employeeId:'e013', type:'Other', amount:1200, description:'Safety gear reimbursement', dateFiled:'2026-06-10', status:'Rejected'},
];

const SEED_HMO_PLANS = [
  {id:'p001', name:'Bronze Care', coverage:100000, premium:850, description:'Basic inpatient and outpatient coverage'},
  {id:'p002', name:'Silver Shield', coverage:200000, premium:1450, description:'Expanded coverage with annual physical exam'},
  {id:'p003', name:'Gold Wellness', coverage:350000, premium:2200, description:'Full coverage plus dental and 2 dependents'},
];

const SEED_ENROLLMENTS = [
  {id:'n001', employeeId:'e001', planId:'p002', dependents:1, dateEnrolled:'2022-04-01', status:'Active'},
  {id:'n002', employeeId:'e003', planId:'p003', dependents:2, dateEnrolled:'2021-07-15', status:'Active'},
  {id:'n003', employeeId:'e007', planId:'p003', dependents:3, dateEnrolled:'2019-06-01', status:'Active'},
  {id:'n004', employeeId:'e010', planId:'p002', dependents:0, dateEnrolled:'2020-05-01', status:'Active'},
  {id:'n005', employeeId:'e004', planId:'p001', dependents:0, dateEnrolled:'2023-09-01', status:'Active'},
  {id:'n006', employeeId:'e012', planId:'p002', dependents:1, dateEnrolled:'2022-08-01', status:'Active'},
];

const SEED_BONUS_PLANS = [
  {id:'b001', title:'13th Month Pay', scope:'All Employees', type:'Statutory', period:'December 2026', notes:'Computed as total basic salary earned for the year divided by 12'},
  {id:'b002', title:'Kitchen Team Performance Bonus', scope:'Kitchen', type:'Discretionary', period:'Q3 2026', notes:'Awarded for consistent food-cost efficiency and guest ratings'},
  {id:'b003', title:'Front Office Guest Satisfaction Incentive', scope:'Front Office', type:'Discretionary', period:'Q3 2026', notes:'Tied to guest survey scores above 4.5/5'},
];

let STATE = {
  employees: [],
  claims: [],
  hmoPlans: [],
  enrollments: [],
  bonusPlans: [],
  payrollRuns: [],
  activeView: 'dashboard',
};

/* ---- storage helpers ---- */
const AUTH_TOKEN_KEY = 'payroll_auth_token';
const AUTH_USER_KEY = 'payroll_auth_user';
const API_BASE_URL = window.PAYROLL_API_URL || 'http://localhost:5000/api';
let AUTH_USER = null;

function getAuthToken(){ return localStorage.getItem(AUTH_TOKEN_KEY); }
function clearAuth(){ localStorage.removeItem(AUTH_TOKEN_KEY); localStorage.removeItem(AUTH_USER_KEY); AUTH_USER = null; }

async function login(email, password){
  const response = await fetch(`${API_BASE_URL}/auth/login`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email, password}),
  });
  const payload = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(payload.message || 'Unable to sign in');
  localStorage.setItem(AUTH_TOKEN_KEY, payload.token);
  localStorage.setItem(AUTH_USER_KEY, JSON.stringify(payload.data));
  AUTH_USER = payload.data;
}

async function register(name, email, password){
  let response;
  try{
    response = await fetch(`${API_BASE_URL}/auth/register`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, email, password}),
    });
  }catch(e){
    throw new Error('Cannot reach the backend. Confirm it is running at http://localhost:5000.');
  }
  const payload = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(payload.message || 'Unable to create account');
  return payload;
}

async function restoreAuth(){
  const token = getAuthToken();
  if(!token) return false;
  try{
    const response = await fetch(`${API_BASE_URL}/auth/me`, {headers:{Authorization:`Bearer ${token}`}});
    if(!response.ok) throw new Error('Session expired');
    const payload = await response.json();
    AUTH_USER = payload.data;
    localStorage.setItem(AUTH_USER_KEY, JSON.stringify(AUTH_USER));
    return true;
  }catch(e){
    clearAuth();
    return false;
  }
}

function renderLogin(error='', mode='login'){
  const isRegistering = mode === 'register';
  document.getElementById('app').innerHTML = `
    <main class="login-screen">
      <form class="login-card" id="login-form">
        <div class="brand-mark">Oxford Suites Makati</div>
        <div class="brand-sub">Payroll &amp; Benefits</div>
        <h1>${isRegistering ? 'Create account' : 'Sign in'}</h1>
        <p class="login-help">${isRegistering ? 'New accounts are created with viewer access.' : 'Use your administrator or HR account to continue.'}</p>
        ${error ? `<div class="login-error" role="alert">${error}</div>` : ''}
        ${isRegistering ? '<div class="field"><label for="login-name">Name</label><input id="login-name" type="text" required autocomplete="name"></div>' : ''}
        <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" minlength="8" required autocomplete="current-password"></div>
        ${isRegistering ? '<div class="field"><label for="login-confirm-password">Confirm password</label><input id="login-confirm-password" type="password" minlength="8" required autocomplete="new-password"></div>' : ''}
        <button class="btn btn-primary" type="submit" id="login-submit">${isRegistering ? 'Create account' : 'Sign in'}</button>
        <button class="login-switch" type="button" id="login-switch">${isRegistering ? 'Already have an account? Sign in' : 'Need an account? Register'}</button>
      </form>
    </main>`;
  document.getElementById('login-switch').addEventListener('click', ()=>renderLogin('', isRegistering ? 'login' : 'register'));
  document.getElementById('login-form').addEventListener('submit', async (event)=>{
    event.preventDefault();
    const button = document.getElementById('login-submit');
    button.disabled = true;
    button.textContent = 'Please wait…';
    try{
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      if(isRegistering){
        const name = document.getElementById('login-name').value;
        const confirmation = document.getElementById('login-confirm-password').value;
        if(password !== confirmation) throw new Error('Passwords do not match');
        await register(name, email, password);
        renderLogin('Account created — please sign in', 'login');
        return;
      }else{
        await login(email, password);
      }
      await loadAll();
      render();
    }catch(e){
      renderLogin(e.message, mode);
    }
  });
}

async function loadAll(){
  const keys = ['employees','claims','hmoPlans','enrollments','bonusPlans','payrollRuns'];
  const seeds = {employees:SEED_EMPLOYEES, claims:SEED_CLAIMS, hmoPlans:SEED_HMO_PLANS, enrollments:SEED_ENROLLMENTS, bonusPlans:SEED_BONUS_PLANS, payrollRuns:[]};
  for(const k of keys){
    try{
      const r = await window.storage.get(k, false);
      STATE[k] = r ? JSON.parse(r.value) : seeds[k];
      if(!r){ await window.storage.set(k, JSON.stringify(seeds[k]), false); }
    }catch(e){
      STATE[k] = seeds[k];
      try{ await window.storage.set(k, JSON.stringify(seeds[k]), false); }catch(e2){}
    }
  }
}
async function persist(key){
  try{ await window.storage.set(key, JSON.stringify(STATE[key]), false); }
  catch(e){ console.error('storage error', e); }
}

/* ============================= UTILITIES ============================= */
function peso(n){
  const v = Math.round((n||0)*100)/100;
  return '₱' + v.toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pesoShort(n){
  const v = Math.round(n||0);
  return '₱' + v.toLocaleString('en-PH');
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-PH', {year:'numeric', month:'short', day:'numeric'});
}
function empName(id){ const e = STATE.employees.find(x=>x.id===id); return e ? e.name : 'Unknown'; }
function emp(id){ return STATE.employees.find(x=>x.id===id); }
function planName(id){ const p = STATE.hmoPlans.find(x=>x.id===id); return p ? p.name : 'Unknown'; }
function toast(msg){

  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---- Philippine statutory deduction approximations (simplified, for demo use) ---- */
function calcSSS(monthly){
  const capped = Math.min(Math.max(monthly, 4000), 30000);
  return Math.round(capped * 0.045 * 100) / 100;
}
function calcPhilHealth(monthly){
  const capped = Math.min(Math.max(monthly, 10000), 100000);
  return Math.round(capped * 0.025 * 100) / 100;
}
function calcPagIbig(monthly){
  return Math.round(Math.min(monthly * 0.02, 200) * 100) / 100;
}
function calcWithholdingTax(taxableMonthly){
  const t = taxableMonthly;
  let tax = 0;
  if(t <= 20833) tax = 0;
  else if(t <= 33332) tax = (t - 20833) * 0.15;
  else if(t <= 66666) tax = 1875 + (t - 33333) * 0.20;
  else if(t <= 166666) tax = 8541.80 + (t - 66667) * 0.25;
  else if(t <= 666666) tax = 33541.80 + (t - 166667) * 0.30;
  else tax = 183541.80 + (t - 666667) * 0.35;
  return Math.round(Math.max(tax,0) * 100) / 100;
}
function computePayrollEntry(employee, allowance=1500, adjustment=0){
  const basic = employee.baseSalary;
  const sss = calcSSS(basic);
  const philhealth = calcPhilHealth(basic);
  const pagibig = calcPagIbig(basic);
  const taxable = basic - sss - philhealth - pagibig;
  const tax = calcWithholdingTax(taxable);
  const totalDeductions = sss + philhealth + pagibig + tax;
  const grossPay = basic + allowance;
  const netPay = grossPay - totalDeductions + Number(adjustment||0);
  return {employeeId: employee.id, basic, allowance, sss, philhealth, pagibig, tax, totalDeductions, grossPay, adjustment:Number(adjustment||0), netPay};
}

          <tbody>
            ${grades.map(g=>`
              <tr>
                <td class="row-name">${g.position}</td>
                <td>${g.department}</td>
                <td class="num">${pesoShort(g.min)}</td>
                <td class="num">${pesoShort(g.mid)}</td>
                <td class="num">${pesoShort(g.max)}</td>
                <td class="num">${g.count}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">13th month &amp; bonus planning</div></div>
        <button class="btn btn-ghost btn-sm" id="btn-add-bonus">Add bonus plan</button>
      </div>
      <div class="panel-body" style="padding:0;">
        <table class="ledger">
          <thead><tr><th>Title</th><th>Scope</th><th>Type</th><th>Period</th><th></th></tr></thead>
          <tbody>
            ${STATE.bonusPlans.map(b=>`
              <tr>
                <td class="row-name">${b.title}<div class="row-sub">${b.notes}</div></td>
                <td>${b.scope}</td>
                <td><span class="pill">${b.type}</span></td>
                <td>${b.period}</td>
                <td><button class="btn-danger-text" data-del-bonus="${b.id}">Remove</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
        ${STATE.bonusPlans.length===0 ? '<div class="empty">No bonus plans yet.</div>' : ''}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div class="panel-title">13th month pay estimator</div></div>
      <div class="panel-body">
        <div class="field-row">
          <div class="field"><label>Employee</label>
            <select id="tm-employee">${STATE.employees.filter(e=>e.status==='Active').map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Months worked this year</label><input type="number" id="tm-months" value="12" min="1" max="12"></div>
        </div>
        <div id="tm-result" class="kpi-card" style="max-width:280px;">
          <div class="kpi-label">Estimated 13th month pay</div>
          <div class="kpi-value num" style="font-size:22px" id="tm-value">—</div>
        </div>
      </div>
    </div>
  </div>`;
}

function calc13thMonth(){
  const empId = document.getElementById('tm-employee')?.value;
  const months = Number(document.getElementById('tm-months')?.value)||12;
  const e = emp(empId);
  if(!e) return;
  const val = (e.baseSalary * months) / 12;
  document.getElementById('tm-value').textContent = pesoShort(val);
}

/* ============================= MODAL HELPERS ============================= */
function showModal(title, bodyHtml){
  let backdrop = document.getElementById('modal-backdrop');
  if(backdrop) backdrop.remove();
  backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${title}</div>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  backdrop.addEventListener('click', (ev)=>{ if(ev.target===backdrop) closeModal(); });
}
function closeModal(){
  const b = document.getElementById('modal-backdrop');
  if(b) b.remove();
}

/* ============================= EVENT BINDING ============================= */
function bindViewEvents(){
  const byId = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };

  byId('btn-run-payroll', openRunPayrollModal);
  byId('btn-add-employee', openAddEmployeeModal);
  byId('btn-add-bonus', openAddBonusModal);
  byId('btn-new-claim', openNewClaimModal);
  byId('btn-new-enrollment', openNewEnrollmentModal);

  document.querySelectorAll('[data-view-run]').forEach(b=>b.addEventListener('click', ()=>openRunBreakdown(b.dataset.viewRun)));

  document.querySelectorAll('[data-deactivate]').forEach(b=>b.addEventListener('click', async ()=>{
    const e = emp(b.dataset.deactivate);
    if(e){ e.status='Inactive'; await persist('employees'); renderView(); toast(e.name + ' marked inactive'); }
  }));

  document.querySelectorAll('[data-claim-approve]').forEach(b=>b.addEventListener('click', async ()=>{
    const c = STATE.claims.find(x=>x.id===b.dataset.claimApprove);
    if(c){ c.status='Approved'; await persist('claims'); renderView(); toast('Claim approved'); }
  }));
  document.querySelectorAll('[data-claim-reject]').forEach(b=>b.addEventListener('click', async ()=>{
    const c = STATE.claims.find(x=>x.id===b.dataset.claimReject);
    if(c){ c.status='Rejected'; await persist('claims'); renderView(); toast('Claim rejected'); }
  }));

  document.querySelectorAll('[data-del-bonus]').forEach(b=>b.addEventListener('click', async ()=>{
    STATE.bonusPlans = STATE.bonusPlans.filter(x=>x.id!==b.dataset.delBonus);
    await persist('bonusPlans'); renderView(); toast('Bonus plan removed');
  }));

  document.querySelectorAll('[data-drop-enroll]').forEach(b=>b.addEventListener('click', async ()=>{
    const en = STATE.enrollments.find(x=>x.id===b.dataset.dropEnroll);
    if(en){ en.status='Inactive'; await persist('enrollments'); renderView(); toast('Enrollment dropped'); }
  }));

  const tmEmp = document.getElementById('tm-employee');
  const tmMonths = document.getElementById('tm-months');
  if(tmEmp && tmMonths){
    tmEmp.addEventListener('change', calc13thMonth);
    tmMonths.addEventListener('input', calc13thMonth);
    calc13thMonth();
  }
}

(async function init(){
  if(await restoreAuth()){
    await loadAll();
    render();
  }else{
    renderLogin();
  }
})();
</script>
